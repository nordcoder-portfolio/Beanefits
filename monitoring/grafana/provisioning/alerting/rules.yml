apiVersion: 1

groups:
  - orgId: 1
    name: beanefits
    folder: beanefits
    interval: 30s
    rules:
      - uid: beanefits_service_down
        title: beanefits service is down
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: up{job="beanefits"}
              intervalMs: 1000
              maxDataPoints: 43200

          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: classic_conditions
              datasource:
                type: "__expr__"
                uid: "__expr__"
              conditions:
                - type: query
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and

        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "beanefits недоступен (Prometheus up < 1)"
        labels:
          service: beanefits
          severity: critical

      - uid: beanefits_error_logs
        title: beanefits has ERROR logs
        condition: B
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: sum(count_over_time({compose_project=~"beanefits.*", compose_service="api", level=~"(?i)error"}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200

          - refId: B
            datasourceUid: "__expr__"
            model:
              refId: B
              type: classic_conditions
              datasource:
                type: "__expr__"
                uid: "__expr__"
              conditions:
                - type: query
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and

        noDataState: OK
        execErrState: Alerting
        for: 30s
        annotations:
          summary: "В логах beanefits есть ERROR за последние 5 минут"
        labels:
          service: beanefits
          severity: warning
